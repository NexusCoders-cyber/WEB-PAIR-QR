<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pair Code - Amazing Session</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 30px 30px;
      animation: gridMove 20s linear infinite;
      opacity: 0.3;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(30px, 30px); }
    }

    .container {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
    }

    .card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 35px;
      padding: 45px 40px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35),
                  0 15px 35px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(15px);
      animation: cardSlideIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    @keyframes cardSlideIn {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .icon {
      font-size: 70px;
      margin-bottom: 20px;
      animation: iconBounce 2.5s ease-in-out infinite;
      filter: drop-shadow(0 5px 15px rgba(102, 126, 234, 0.3));
    }

    @keyframes iconBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.05); }
    }

    h1 {
      color: #2d3748;
      font-size: 2rem;
      margin-bottom: 12px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #718096;
      font-size: 1rem;
      line-height: 1.6;
      font-weight: 500;
    }

    .input-group {
      margin-bottom: 28px;
    }

    .input-label {
      display: block;
      color: #4a5568;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 12px;
      padding-left: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      gap: 12px;
    }

    .input-field {
      flex: 1;
      padding: 18px 22px;
      border: 2.5px solid #e2e8f0;
      border-radius: 18px;
      font-size: 1.05rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: #f7fafc;
      font-weight: 600;
      color: #2d3748;
    }

    .input-field:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 5px rgba(102, 126, 234, 0.12),
                  0 5px 15px rgba(102, 126, 234, 0.15);
      transform: translateY(-2px);
    }

    .input-field::placeholder {
      color: #a0aec0;
    }

    .btn {
      padding: 18px 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 18px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result-area {
      margin-top: 28px;
      min-height: 70px;
    }

    .result-box {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.08) 0%, rgba(118, 75, 162, 0.08) 100%);
      border: 2.5px dashed #667eea;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      animation: fadeIn 0.4s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .result-text {
      color: #2d3748;
      font-size: 1rem;
      margin-bottom: 18px;
      font-weight: 600;
    }

    .code-display {
      background: white;
      border-radius: 15px;
      padding: 20px;
      font-size: 2.2rem;
      font-weight: 800;
      color: #667eea;
      letter-spacing: 4px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.15);
    }

    .code-display:hover {
      background: #f7fafc;
      transform: scale(1.06);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.25);
    }

    .code-display:active {
      transform: scale(0.98);
    }

    .loading {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 3.5px solid #e2e8f0;
      border-top: 3.5px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 12px;
      vertical-align: middle;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .back-btn {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #718096;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.3s ease;
      padding: 10px;
      border-radius: 10px;
    }

    .back-btn:hover {
      color: #667eea;
      background: rgba(102, 126, 234, 0.08);
    }

    .error {
      background: linear-gradient(135deg, rgba(252, 129, 129, 0.12) 0%, rgba(245, 101, 101, 0.12) 100%);
      border-color: #fc8181;
      color: #c53030;
    }

    @media (max-width: 600px) {
      .card {
        padding: 35px 28px;
      }

      h1 {
        font-size: 1.7rem;
      }

      .input-wrapper {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .code-display {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="icon">🔢</div>
        <h1>Pair Code Method</h1>
        <p class="subtitle">Enter your WhatsApp number with country code</p>
      </div>

      <div class="input-group">
        <label class="input-label">Phone Number</label>
        <div class="input-wrapper">
          <input 
            type="tel" 
            id="number" 
            class="input-field" 
            placeholder="2347075663318"
            maxlength="15"
          >
          <button id="submit" class="btn">Get Code</button>
        </div>
      </div>

      <div class="result-area" id="result"></div>

      <a href="/" class="back-btn">← Back to Home</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
  <script>
    const resultDiv = document.getElementById("result");
    const submitBtn = document.getElementById("submit");
    const numberInput = document.getElementById("number");

    async function copyCode(element) {
      const code = element.innerText.trim();
      try {
        await navigator.clipboard.writeText(code);
        const original = element.innerHTML;
        element.innerHTML = '✓ COPIED!';
        element.style.color = '#48bb78';
        setTimeout(() => {
          element.innerHTML = original;
          element.style.color = '#667eea';
        }, 2000);
      } catch (err) {
        console.error('Copy failed:', err);
      }
    }

    submitBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      
      const num = numberInput.value.trim();
      
      if (!num) {
        resultDiv.innerHTML = `
          <div class="result-box error">
            <div class="result-text">⚠️ Please enter your phone number</div>
          </div>
        `;
        return;
      }

      const cleanNum = num.replace(/[^0-9]/g, "");
      
      if (cleanNum.length < 10) {
        resultDiv.innerHTML = `
          <div class="result-box error">
            <div class="result-text">⚠️ Invalid number. Include country code.</div>
          </div>
        `;
        return;
      }

      numberInput.value = '+' + cleanNum;
      submitBtn.disabled = true;
      
      resultDiv.innerHTML = `
        <div class="result-box">
          <div class="result-text">
            <span class="loading"></span>
            Generating your pairing code...
          </div>
        </div>
      `;

      try {
        const { data } = await axios.get(`/code?number=${cleanNum}`);
        const code = data.code || "Service Unavailable";
        
        if (code === "Service Unavailable" || code.includes("Failed") || code.includes("Invalid") || code.includes("Wait")) {
          resultDiv.innerHTML = `
            <div class="result-box error">
              <div class="result-text">❌ ${code}</div>
              <div class="result-text" style="font-size: 0.9rem; margin-top: 12px; opacity: 0.8;">
                Please check your number and try again
              </div>
            </div>
          `;
        } else {
          resultDiv.innerHTML = `
            <div class="result-box">
              <div class="result-text">🎉 Your Pairing Code</div>
              <div class="code-display" onclick="copyCode(this)">
                ${code}
              </div>
              <div class="result-text" style="font-size: 0.9rem; margin-top: 18px; opacity: 0.8;">
                Click code to copy • Session will be sent to WhatsApp
              </div>
            </div>
          `;
        }
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="result-box error">
            <div class="result-text">❌ Connection Error</div>
            <div class="result-text" style="font-size: 0.9rem; margin-top: 12px; opacity: 0.8;">
              ${error.message || 'Please try again later'}
            </div>
          </div>
        `;
      } finally {
        submitBtn.disabled = false;
      }
    });

    numberInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        submitBtn.click();
      }
    });

    numberInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9+]/g, '');
    });
  </script>
</body>
</html>
