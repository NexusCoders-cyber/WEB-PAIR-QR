<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazing Session Pairing | NexusCoders</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      overflow-x: hidden;
      position: relative;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: float 20s infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
    }

    .container {
      z-index: 1;
      text-align: center;
      padding: 20px;
      max-width: 600px;
      width: 100%;
    }

    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: logoFloat 3s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      color: white;
      font-size: 3rem;
      margin-bottom: 15px;
      font-weight: 800;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      letter-spacing: 2px;
      animation: titleGlow 2s ease-in-out infinite alternate;
    }

    @keyframes titleGlow {
      from { text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); }
      to { text-shadow: 0 4px 30px rgba(255, 255, 255, 0.6); }
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.95);
      font-size: 1.2rem;
      margin-bottom: 40px;
      font-weight: 300;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }

    .btn {
      width: 100%;
      padding: 18px 30px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 50px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      color: white;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      letter-spacing: 1px;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .btn:active {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    }

    .btn i {
      margin-right: 10px;
      font-size: 1.3rem;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .feature {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .feature:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-5px);
    }

    .feature-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .feature-text {
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .footer {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
      text-align: center;
      z-index: 1;
    }

    .footer a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .footer a:hover {
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
      
      .subtitle {
        font-size: 1rem;
      }
      
      .btn {
        padding: 15px 25px;
        font-size: 1rem;
      }
      
      .logo {
        width: 90px;
        height: 90px;
        font-size: 45px;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <div class="container">
    <div class="logo">⚡</div>
    <h1>AMAZING SESSION</h1>
    <p class="subtitle">Lightning-Fast WhatsApp Pairing System</p>

    <div class="btn-container">
      <button onclick="window.location.href='/qrpage'" class="btn btn-primary">
        <span>📱 QR Code Pairing</span>
      </button>
      <button onclick="window.location.href='/pair'" class="btn btn-primary">
        <span>🔢 Pair Code Method</span>
      </button>
      <button onclick="window.open('https://github.com/NexusCoders-cyber/Amazing-Bot-', '_blank')" class="btn">
        <span>⭐ GitHub Repository</span>
      </button>
      <button onclick="window.open('https://wa.me/2347075663318', '_blank')" class="btn">
        <span>💬 Contact Support</span>
      </button>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">🚀</div>
        <div class="feature-text">Ultra Fast</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🔒</div>
        <div class="feature-text">Secure</div>
      </div>
      <div class="feature">
        <div class="feature-icon">☁️</div>
        <div class="feature-text">Cloud Storage</div>
      </div>
      <div class="feature">
        <div class="feature-icon">✨</div>
        <div class="feature-text">Easy to Use</div>
      </div>
    </div>
  </div>

  <div class="footer">
    Crafted with 💜 by <a href="https://github.com/NexusCoders-cyber" target="_blank">NexusCoders</a>
  </div>

  <script>
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 50; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 20 + 's';
      particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
      particlesContainer.appendChild(particle);
    }
  </script>
</body>
</html>
