<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazing Session Pairing | NexusCoders</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      background-size: 400% 400%;
      animation: gradientShift 20s ease infinite;
      overflow-x: hidden;
      position: relative;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      animation: float 25s infinite;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-120vh) translateX(100px) scale(0.5); opacity: 0; }
    }

    .container {
      z-index: 1;
      text-align: center;
      padding: 40px 20px;
      max-width: 600px;
      width: 100%;
    }

    .logo {
      width: 140px;
      height: 140px;
      margin: 0 auto 30px;
      background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
      border-radius: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3),
                  0 10px 25px rgba(0, 0, 0, 0.2);
      animation: logoFloat 4s ease-in-out infinite;
      position: relative;
    }

    .logo::before {
      content: '';
      position: absolute;
      inset: -3px;
      background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
      border-radius: 38px;
      z-index: -1;
      opacity: 0.7;
      filter: blur(15px);
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-15px) rotate(2deg); }
      75% { transform: translateY(-15px) rotate(-2deg); }
    }

    h1 {
      color: white;
      font-size: 3.5rem;
      margin-bottom: 20px;
      font-weight: 900;
      text-shadow: 0 5px 25px rgba(0, 0, 0, 0.4);
      letter-spacing: -1px;
      animation: titleGlow 3s ease-in-out infinite alternate;
    }

    @keyframes titleGlow {
      from { text-shadow: 0 5px 25px rgba(0, 0, 0, 0.4); }
      to { text-shadow: 0 5px 35px rgba(255, 255, 255, 0.5); }
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.95);
      font-size: 1.3rem;
      margin-bottom: 50px;
      font-weight: 400;
      text-shadow: 0 2px 15px rgba(0, 0, 0, 0.3);
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 50px;
    }

    .btn {
      width: 100%;
      padding: 22px 35px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      border-radius: 60px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      font-size: 1.15rem;
      font-weight: 700;
      text-transform: uppercase;
      color: white;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
      letter-spacing: 1.5px;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: left 0.6s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .btn:active {
      transform: translateY(-4px) scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.9) 0%, rgba(118, 75, 162, 0.9) 100%);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, rgba(118, 75, 162, 0.9) 0%, rgba(102, 126, 234, 0.9) 100%);
    }

    .btn i {
      margin-right: 12px;
      font-size: 1.4rem;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
      margin-top: 50px;
    }

    .feature {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px);
      padding: 25px;
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.4s ease;
    }

    .feature:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .feature-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
    }

    .feature-text {
      color: white;
      font-size: 1rem;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .footer {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.85);
      font-size: 1rem;
      text-align: center;
      z-index: 1;
      font-weight: 500;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .footer a {
      color: white;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s ease;
      padding: 5px 10px;
      border-radius: 8px;
    }

    .footer a:hover {
      background: rgba(255, 255, 255, 0.15);
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.5rem;
      }
      
      .subtitle {
        font-size: 1.1rem;
      }
      
      .btn {
        padding: 18px 28px;
        font-size: 1rem;
      }
      
      .logo {
        width: 110px;
        height: 110px;
        font-size: 55px;
      }

      .features {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <div class="container">
    <div class="logo">⚡</div>
    <h1>AMAZING SESSION</h1>
    <p class="subtitle">Lightning-Fast WhatsApp Pairing System</p>

    <div class="btn-container">
      <button onclick="window.location.href='/qrpage'" class="btn btn-primary">
        <span>📱 QR Code Pairing</span>
      </button>
      <button onclick="window.location.href='/pair'" class="btn btn-primary">
        <span>🔢 Pair Code Method</span>
      </button>
      <button onclick="window.open('https://github.com/NexusCoders-cyber/Amazing-Bot-', '_blank')" class="btn">
        <span>⭐ GitHub Repository</span>
      </button>
      <button onclick="window.open('https://wa.me/2347075663318', '_blank')" class="btn">
        <span>💬 Contact Support</span>
      </button>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">🚀</div>
        <div class="feature-text">Ultra Fast</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🔒</div>
        <div class="feature-text">Secure</div>
      </div>
      <div class="feature">
        <div class="feature-icon">☁️</div>
        <div class="feature-text">Cloud Storage</div>
      </div>
      <div class="feature">
        <div class="feature-icon">✨</div>
        <div class="feature-text">Easy to Use</div>
      </div>
    </div>
  </div>

  <div class="footer">
    Crafted with 💜 by <a href="https://github.com/NexusCoders-cyber" target="_blank">NexusCoders</a>
  </div>

  <script>
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 60; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 25 + 's';
      particle.style.animationDuration = (Math.random() * 15 + 15) + 's';
      particlesContainer.appendChild(particle);
    }
  </script>
</body>
</html>
